spec:
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: n8n
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
